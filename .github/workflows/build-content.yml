name: Build content

# Po każdym pushu zmieniającym treść (pliki w content/ lub zdjęcia w uploads/):
#  1. konwertuje wgrane zdjęcia do WebP i podmienia ścieżki w treści,
#  2. przebudowuje pliki zbiorcze (content/projects.json, content/news.json)
#     oraz miniatury do siatki zdjęć w Aktualnościach,
#  3. generuje podstrony pod prawdziwymi adresami (/labirynt/, /kontakt/ …),
#     mapę strony i 404.html — bez tego Google widziałby tylko stronę główną,
#  4. commituje wynik z powrotem do repo → strona aktualizuje się sama.
# Panel CMS został usunięty (2026-07-06, kopia w Portfolio-archiwum/cms-panel/);
# treść edytuje się ręcznie w content/projects/*.json i content/news/*.json.
#
# Commit robiony domyślnym GITHUB_TOKEN nie wywołuje kolejnego uruchomienia
# workflow (GitHub blokuje rekurencję), więc nie ma pętli.

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "images/uploads/**"
      - "images/achievements/**"
      - "index.html"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pełna historia — generator mapy strony czyta z git, kiedy
          # ostatnio zmienił się plik z treścią każdej podstrony (lastmod).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności (sharp)
        run: npm ci || npm install

      - name: Konwersja wgranych zdjęć do WebP
        run: node tools/optimize-images.js

      - name: Przebudowa plików zbiorczych
        run: node tools/build-content.js

      - name: Miniatury do siatki Aktualności
        run: node tools/build-thumbs.js

      - name: Generowanie podstron, mapy strony i 404
        run: node tools/build-pages.js

      - name: Commit wyników (jeśli coś się zmieniło)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto: przebudowa treści + WebP [skip ci]"
            git push
          else
            echo "Brak zmian do commitowania."
          fi
